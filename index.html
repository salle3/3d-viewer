<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Model Viewer with Hover Effect</title>
  <style>
    body, html {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      cursor: pointer; /* Change cursor on hover */
    }
  </style>
  <!-- Import maps let the browser resolve bare module specifiers -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
  </script>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

  // Init scene
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
  // Move camera further back to accommodate even larger model
  camera.position.z = 4.0;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(light);

  // Variable to track if mouse is hovering
  let isHovering = false;
  // Store original materials for restoration (keep for potential future use)
  let originalMaterials = [];
  
  // Add event listeners for hover effect
  renderer.domElement.addEventListener('mouseenter', () => {
    isHovering = true;
    // No material change on hover, only scale animation
  });
  
  renderer.domElement.addEventListener('mouseleave', () => {
    isHovering = false;
    if (model) {
      // Reset the scale when not hovering
      gsap.to(model.scale, { x: 1.8, y: 1.8, z: 1.8, duration: 0.5, ease: "elastic.out(1, 0.3)" });
    }
  });

  // Load GLB
  const loader = new GLTFLoader();
  let model;
  loader.load('model.glb', (gltf) => {
    model = gltf.scene;
    scene.add(model);
    
    // Center and scale the model
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.x = -center.x;
    model.position.y = -center.y;
    model.position.z = -center.z;
    
    // Set initial rotation
    model.rotation.y = -Math.PI/6;
    
    // Increase initial scale to make model even larger
    const initialScale = 1.8; // Increased from 1.3
    model.scale.set(initialScale, initialScale, initialScale);
    
    // Create glass-like material - even darker but less matte
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x555555, // Much darker gray color
      metalness: 0.15,
      roughness: 0.15, // Decreased roughness to make it less matte
      transmission: 0.8, // Slightly higher transmission
      transparent: true,
      opacity: 0.7, // Same opacity
      clearcoat: 0.85, // Slightly more clearcoat
      clearcoatRoughness: 0.2, // Less roughness in clearcoat
      ior: 1.5, // Same index of refraction
      envMapIntensity: 0.8, // Same environment reflection
      side: THREE.DoubleSide
    });
    
    // Apply the glass material to all meshes in the model
    model.traverse((child) => {
      if (child.isMesh) {
        // Save original material in case we need it for hover effects
        originalMaterials.push({
          object: child,
          material: child.material.clone()
        });
        
        // Apply glass material
        child.material = glassMaterial.clone();
      }
    });
    
    // Add directional light for better visibility of glass material
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);
    
    // Add second directional light from opposite side for better refraction
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight2.position.set(-5, -2, -5);
    scene.add(directionalLight2);
    
    // Add ambient light for overall illumination
    const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
    scene.add(ambientLight);
    
    // Create environment map for reflections
    const cubeTextureLoader = new THREE.CubeTextureLoader();
    const envMap = cubeTextureLoader.load([
      'https://threejs.org/examples/textures/cube/Park2/posx.jpg',
      'https://threejs.org/examples/textures/cube/Park2/negx.jpg',
      'https://threejs.org/examples/textures/cube/Park2/posy.jpg',
      'https://threejs.org/examples/textures/cube/Park2/negy.jpg',
      'https://threejs.org/examples/textures/cube/Park2/posz.jpg',
      'https://threejs.org/examples/textures/cube/Park2/negz.jpg'
    ]);
    scene.environment = envMap;
    
    // Start the animation loop
    animate();
  });

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    
    if (model) {
      // Continuous rotation around axes
      model.rotation.y += 0.005;
      model.rotation.x += 0.002;
      model.rotation.z += 0.001;
      
      // Bounce effect when hovering
      if (isHovering) {
        // Create a bouncing effect - reduced amplitude for larger model
        const pulseFactor = Math.sin(Date.now() * 0.005) * 0.03 + 1.03;
        gsap.to(model.scale, { 
          x: pulseFactor * 1.8, // Apply to the new base scale
          y: pulseFactor * 1.8,
          z: pulseFactor * 1.8,
          duration: 0.1,
          overwrite: true
        });
      }
    }
    
    renderer.render(scene, camera);
  }

  // Responsive
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
